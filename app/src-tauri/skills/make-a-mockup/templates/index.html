<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main data-part="login-page">
    <h1>Sign in</h1>
    <form class="card" data-part="login-form">
      <label>Email <input name="email" type="email" autocomplete="off"></label>
      <label>Password <input name="pass" type="password" autocomplete="off"></label>
      <p class="error" data-part="login-error" role="alert" hidden></p>
      <button type="button" data-part="login-submit">Sign in</button>
    </form>
    <section class="card" data-part="fake-accounts-box">
      <p class="muted">Made-up accounts for trying this page. Pick one to fill the form.</p>
      <div data-part="fake-accounts"></div>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
